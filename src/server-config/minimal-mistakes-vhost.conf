# Virtual Host configuration for minimal-mistakes
<VirtualHost *:80>
    ServerName minimal-mistakes.local
    ServerAlias www.minimal-mistakes.local
    DocumentRoot "C:/xampp3/htdocs/minimal-mistakes/_site"
    
    <Directory "C:/xampp3/htdocs/minimal-mistakes/_site">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>
    
    ErrorLog "logs/minimal-mistakes-error.log"
    CustomLog "logs/minimal-mistakes-access.log" combined
</VirtualHost>
