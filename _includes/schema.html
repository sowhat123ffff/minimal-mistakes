<!-- Organization Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "AC SPACE Digital",
  "url": {{ '/' | absolute_url | jsonify }},
  "logo": {{ '/assets/images/ac-space-icon.svg' | absolute_url | jsonify }},
  "description": {{ site.description | jsonify }},
  "address": {
    "@type": "PostalAddress",
    "addressCountry": "Malaysia"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "+60164390224",
    "contactType": "customer service"
  },
  "sameAs": [
    "https://twitter.com/acspacedigital",
    "https://facebook.com/acspacedigital",
    "https://linkedin.com/company/acspacedigital",
    "https://instagram.com/acspacedigital",
    "https://youtube.com/acspacedigital"
  ]
}
</script>

<!-- WebSite Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }}
}
</script>

<!-- Service Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "serviceType": "SEO Services",
  "provider": {
    "@type": "Organization",
    "name": "AC SPACE Digital"
  },
  "description": "Get organic traffic and high rankings with multi-team collaboration that will help you optimize on-page and off-page SEO.",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "MYR"
  }
}
</script>

<!-- FAQ Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What SEO services does AC SPACE offer?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "AC SPACE offers comprehensive SEO services including keyword research, on-page optimization, technical SEO audits, content strategy, and link building."
      }
    },
    {
      "@type": "Question",
      "name": "How long does it take to see results from SEO?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "SEO is a long-term strategy. While some improvements can be seen within a few weeks, significant results typically take 3-6 months depending on your industry, competition, and starting point."
      }
    },
    {
      "@type": "Question",
      "name": "How can I contact AC SPACE for SEO services?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You can contact us directly through our WhatsApp button on the website or visit our contact page to send us a message."
      }
    }
  ]
}
</script>
