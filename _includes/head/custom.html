<!-- Inline CSS for critical mobile fixes -->
<style>
  @media (max-width: 991px) {
    /* Critical masthead fixes */
    .masthead {
      display: block !important;
      visibility: visible !important;
    }
    .masthead__inner-wrap {
      display: flex !important;
      visibility: visible !important;
      flex-wrap: wrap;
      position: relative;
    }

    /* Critical fix for site title on mobile */
    .site-logo a.site-title {
      display: flex !important;
      visibility: visible !important;
      white-space: nowrap !important;
      overflow: visible !important;
      color: #000000 !important;
    }

    /* Critical fix for navigation on mobile */
    .greedy-nav {
      display: flex !important;
      visibility: visible !important;
      position: relative !important;
      width: 100%;
    }

    /* Critical fix for hamburger button */
    .greedy-nav__toggle {
      display: block !important;
      visibility: visible !important;
      position: absolute !important;
      top: -40px !important;
      right: 15px !important;
    }

    /* Critical fix for hamburger button lines */
    .greedy-nav__toggle .navicon,
    .greedy-nav__toggle .navicon:before,
    .greedy-nav__toggle .navicon:after {
      background: #1d1c3d !important;
      display: block !important;
    }

    /* Critical fix for mobile menu */
    .greedy-nav .visible-links.visible-mobile {
      display: flex !important;
      visibility: visible !important;
    }
  }
</style>
