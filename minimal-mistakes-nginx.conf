server {
    listen 80;
    listen [::]:80;
    
    # Replace with your actual domain
    server_name nothingshop.site www.nothingshop.site;
    
    # Path to your Jekyll _site directory
    root /var/www/html/website/minimal-mistakes/_site;
    index index.html;

    # Logging configuration
    access_log /var/log/nginx/minimal-mistakes-access.log;
    error_log /var/log/nginx/minimal-mistakes-error.log;

    # URL rewriting (equivalent to .htaccess RewriteRule)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Set default character set (equivalent to AddDefaultCharset)
    charset utf-8;

    # Enable compression (equivalent to mod_deflate)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Set caching headers (equivalent to mod_expires)
    location ~* \.(jpg|jpeg|gif|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }
    
    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }
    
    location ~* \.(pdf)$ {
        expires 1M;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }
    
    location ~* \.(html|htm)$ {
        expires 0;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Handle 404 errors
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
