<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Service Image</title>
    <style>
        .service-feature-image {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            background-color: #f0f0f0;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .service-feature-image img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            object-fit: cover;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <h1>Debug Service Image</h1>
    
    <div class="service-feature-image">
        <img src="assets/images/fluxi/service/01.jpg" alt="Service 1">
    </div>
    
    <h2>Second Image</h2>
    
    <div class="service-feature-image">
        <img src="assets/images/fluxi/service/02.jpg" alt="Service 2">
    </div>
    
    <script>
        // Check if images loaded successfully
        document.addEventListener('DOMContentLoaded', function() {
            const images = document.querySelectorAll('img');
            images.forEach(img => {
                img.addEventListener('error', function() {
                    console.error('Failed to load image:', this.src);
                    this.style.display = 'none';
                    this.parentElement.textContent = 'Image failed to load: ' + this.src;
                });
                
                img.addEventListener('load', function() {
                    console.log('Image loaded successfully:', this.src);
                });
            });
        });
    </script>
</body>
</html>
